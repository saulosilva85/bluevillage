.login-card{width:447px;max-width:92vw;background:rgba(30,41,59,.92);border:1px solid rgba(71,85,105,.6);
  border-radius:16px;padding:34px 32px 32px;box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.login-card h1{text-align:center;color:var(--blue-l);font-size:23px;font-weight:700}
.login-card .sub{text-align:center;color:#cbd5e1;font-size:14px;margin:4px 0 26px}
.login-card label{display:block;font-size:14px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
.login-card input{width:100%;height:46px;background:#0f172a;border:1px solid var(--border);border-radius:8px;
  color:#fff;padding:0 16px;font-size:16px;margin-bottom:18px;outline:none}
.login-card input:focus{border-color:var(--blue-l)}
.btn-login{width:100%;height:44px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;
  font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.45)}
.btn-login:hover{background:#1d4ed8}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:16px}

/* ===== APP ===== */
header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{width:40px;height:40px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-size:18px}
.brand b{font-size:18px;display:block}
.brand small{font-size:12px;color:var(--blue-l)}
/* usuário e sair no rodapé do menu */
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 8px 4px}
.side-user{display:flex;align-items:center;gap:12px;padding:6px 8px 12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
.side-user b{display:block;font-size:14px;line-height:1.3;word-break:break-word}
.side-user small{color:var(--muted);font-size:12px}
.logout{width:100%;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:8px;border:0;background:none;
  color:#e2e8f0;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
.logout i{width:20px;text-align:center;color:#cbd5e1}
.logout:hover{background:#3a1720;color:var(--red)}.logout:hover i{color:var(--red)}
.menu-toggle{display:none;width:36px;height:36px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;margin-right:6px}
.layout{display:flex;min-height:calc(100vh - 74px)}
aside{width:248px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:16px 8px;
  display:flex;flex-direction:column;position:sticky;top:74px;height:calc(100vh - 74px);overflow-y:auto}
.nav{display:flex;align-items:center;gap:14px;padding:11px 16px;margin-bottom:6px;border-radius:8px;cursor:pointer;
  color:#e2e8f0;font-size:16px;font-weight:500;line-height:1.5}
.nav i{width:20px;text-align:center;color:#cbd5e1;font-size:16px}
.nav:hover{background:#273449}
.nav.active{background:var(--blue);color:#fff}
.nav.active i{color:#fff}
main{flex:1;padding:32px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:20px;font-weight:700}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:12.5px;color:#cbd5e1}
.chip b{color:var(--blue-l)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:16px 18px;margin-bottom:22px;border:1px solid}
.alert i{font-size:20px;margin-top:2px}
.alert b{display:block;font-size:14px}.alert span{font-size:13px}
.alert.ok{background:#0f2e33;border-color:#11604f;color:var(--green)}
.alert.warn{background:#33290f;border-color:#7a5a12;color:var(--yellow)}
.alert.bad{background:#3a1720;border-color:#7f1d2d;color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px}
.kpi p{color:var(--muted);font-size:14px;margin-bottom:10px}
.kpi h3{font-size:24px;font-weight:700}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:24px;gap:10px;flex-wrap:wrap}
.panel-h h4{font-size:18px;display:flex;gap:10px;align-items:center}
.panel-h h4 i{color:var(--blue-l)}
.panel-h small{color:var(--muted);font-size:12.5px}
.towers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tower{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:22px 20px}
.tower .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-weight:700;font-size:15px}
.badge{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:600}
.track{height:23px;border-radius:6px;background:#1e293b;overflow:hidden}
.track div{height:100%;border-radius:6px;transition:width .4s}
.tower .det{margin-top:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

/* forms & tables */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.form input,.form select,.form textarea{width:100%;height:38px;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;color:#fff;padding:0 10px;outline:none}
.form input:focus,.form select:focus{border-color:var(--blue-l)}
.btn{height:38px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:600;padding:0 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:#1d4ed8}
.btn.sec{background:#334155}.btn.sec:hover{background:#475569}
.btn.danger{background:#b91c1c}.btn.danger:hover{background:#991b1b}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #263347}
tr:hover td{background:#223047}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13.5px}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}
.icon-btn:hover{color:var(--red)}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;font-weight:600;white-space:nowrap}
.g{color:var(--green)}.r{color:var(--red)}.b{color:var(--blue-l)}.p{color:var(--purple)}.y{color:var(--yellow)}
td select{background:var(--bg);color:#fff;border:1px solid var(--border);border-radius:6px;height:30px;padding:0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.toast{position:fixed;right:20px;bottom:20px;background:#1e293b;border:1px solid var(--border);border-left:4px solid var(--green);
  padding:12px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--red)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
/* olho de mostrar/ocultar senha */
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:46px!important}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;
  color:#94a3b8;cursor:pointer;display:grid;place-items:center;border-radius:6px;padding:0}
.pw-eye:hover{color:#fff;background:rgba(148,163,184,.12)}
.pw-eye svg{width:20px;height:20px}
.login-card .pw-wrap{margin-bottom:18px}.login-card .pw-wrap input{margin-bottom:0}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.7);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:380px;max-width:92vw}
.modal h4{font-size:17px;margin-bottom:16px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.towers,.grid2{grid-template-columns:1fr}}
@media(max-width:800px){
  .menu-toggle{display:block}
  aside{position:fixed;top:74px;bottom:0;left:0;z-index:10;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  main{padding:18px}.kpis{grid-template-columns:1fr}
}
</style>
</head>

</div>

<script>
/* ---------- SHA-256 (funciona também via file://) ---------- */
const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
const primes=(()=>{const p=[];for(let n=2;p.length<64;n++)if(p.every(q=>n%q))p.push(n);return p})();
const K=primes.map(q=>(Math.cbrt(q)%1)*4294967296>>>0);
const H0=primes.slice(0,8).map(q=>(Math.sqrt(q)%1)*4294967296>>>0);
function sha256(str){
  const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6;
  const m=new Uint8Array(n);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
  let H=H0.slice();const w=new Uint32Array(64);
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];w[t]=(w[t-16]+(rotr(a,7)^rotr(a,18)^(a>>>3))+w[t-7]+(rotr(c,17)^rotr(c,19)^(c>>>10)))>>>0}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const t1=(h+(rotr(e,6)^rotr(e,11)^rotr(e,25))+((e&f)^(~e&g))+K[t]+w[t])>>>0;
      const t2=((rotr(a,2)^rotr(a,13)^rotr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    H=[a,bb,c,d,e,f,g,h].map((v,k)=>(v+H[k])>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}
const hashPass=(u,p)=>sha256('bluevillage:'+u.toLowerCase()+':'+p);

/* ---------- Banco local (localStorage) ---------- */
const DBKEY='bluevillage_db_v1';
const TORRES=['Jurerê','Gunga','Itacaré'];
const TCOR={'Jurerê':'#60a5fa','Gunga':'#34d399','Itacaré':'#c084fc'};
function seed(){return{
  users:[{id:uid(),user:'admin',nome:'Admin',perfil:'Administrador',hash:hashPass('admin','Blue@2027!'),ativo:true}],
  lanc:[],manut:[],forn:[],logs:[],config:{salario:1518,mult:5}
}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let db;
try{db=JSON.parse(localStorage.getItem(DBKEY))}catch(e){}
if(!db||!db.users){db=seed();save()}
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function log(acao){db.logs.unshift({ts:new Date().toISOString(),user:me()?me().user:'-',acao});db.logs=db.logs.slice(0,1000);save()}

/* ---------- Utilidades ---------- */
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR'):'-';
const dth=s=>new Date(s).toLocaleString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ym=()=>today().slice(0,7);
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function me(){const id=sessionStorage.getItem('bv_sess');return db.users.find(u=>u.id===id)}
const isAdmin=()=>me()&&me().perfil==='Administrador';

/* ---------- Cálculos ---------- */
function calc(){
  const rec=db.lanc.filter(l=>l.tipo==='Receita').reduce((s,l)=>s+ +l.valor,0);
  const desp=db.lanc.filter(l=>l.tipo==='Despesa').reduce((s,l)=>s+ +l.valor,0);
  const despMes=db.lanc.filter(l=>l.tipo==='Despesa'&&l.data.slice(0,7)===ym()).reduce((s,l)=>s+ +l.valor,0);
  const fundo=db.lanc.filter(l=>l.tipo==='Fundo de Reserva').reduce((s,l)=>s+ +l.valor,0)
             -db.lanc.filter(l=>l.tipo==='Resgate do Fundo').reduce((s,l)=>s+ +l.valor,0);
  const contratos=db.forn.filter(c=>c.status==='Ativo').length;
  const teto=db.config.salario*db.config.mult;
  return{saldo:rec-desp,despMes,fundo,contratos,teto};
}

/* ---------- Login ---------- */
document.getElementById('loginForm').onsubmit=e=>{
  e.preventDefault();
  const u=lUser.value.trim().toLowerCase(),p=lPass.value;
  const usr=db.users.find(x=>x.user===u&&x.ativo);
  if(usr&&usr.hash===hashPass(u,p)){
    sessionStorage.setItem('bv_sess',usr.id);log('Login realizado');lPass.value='';boot();
  }else{loginErr.textContent='Usuário ou senha inválidos.';log('Falha de login: '+u)}
};
function logout(){log('Logout');sessionStorage.removeItem('bv_sess');location.reload()}
function boot(){
  if(!me()){login.classList.remove('hidden');app.classList.add('hidden');return}
  login.classList.add('hidden');app.classList.remove('hidden');
  userName.textContent=me().nome;userRole.textContent=me().perfil;userAvatar.textContent=(me().nome[0]||'?').toUpperCase();
  go(location.hash.slice(1)||'dashboard');
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{go(n.dataset.page);document.querySelector('aside').classList.remove('open')});
function go(p){
  if(!PAGES[p])p='dashboard';
  location.hash=p;
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));
  main.innerHTML=PAGES[p]();window.scrollTo(0,0);
  (AFTER[p]||(()=>{}))();
  addEyes(main);
}
const rerender=()=>go(location.hash.slice(1));

/* ---------- Páginas ---------- */
const PAGES={
dashboard(){

  return `
  <div class="page-head"><h2>Painel Geral &amp; Alerta de Teto de Gastos</h2>
    <div class="chip">Salário Mínimo: <b>${brl(db.config.salario)}</b> | Teto (${db.config.mult}x): <b>${brl(c.teto)}</b></div></div>
  <div class="alert ${al[0]}"><i class="fa-solid ${al[1]}"></i><div><b>${al[2]}</b><span>${al[3]}</span></div></div>
  <div class="kpis">
    <div class="kpi"><p>Saldo em Conta</p><h3 class="${c.saldo<0?'r':'g'}">${brl(c.saldo)}</h3></div>
    <div class="kpi"><p>Total Despesas do Mês</p><h3 class="r">${brl(c.despMes)}</h3></div>
    <div class="kpi"><p>Fundo de Reserva</p><h3 class="b">${brl(c.fundo)}</h3></div>
    <div class="kpi"><p>Contratos Ativos</p><h3 class="p">${c.contratos}</h3></div>
  </div>
  <div class="panel">
    <div class="panel-h"><h4><i class="fa-solid fa-chart-column"></i>Relatório Gráfico por Torres</h4><small>Distribuição de Manutenções e Ocorrências</small></div>
    <div class="towers">${TORRES.map((t,i)=>{const col=TCOR[t];
      const ab=db.manut.filter(m=>m.torre===t&&m.status!=='Concluída').length;
      return `<div class="tower"><div class="t"><span style="color:${col}">Torre ${t}</span>
        <span class="badge" style="background:${col}22;color:${col}">${cnt[i]} itens</span></div>
        <div class="track"><div style="width:${cnt[i]/mx*100}%;background:${col}"></div></div>
        <div class="det"><span>Em aberto: ${ab}</span><span>Concluídas: ${cnt[i]-ab}</span></div></div>`}).join('')}
    </div>
  </div>
  <div class="panel">
    <div class="panel-h"><h4><i class="fa-solid fa-clock-rotate-left"></i>Últimos Lançamentos</h4></div>
    ${tbl(['Data','Tipo','Descrição','Torre','Valor'],recent.map(l=>[dt(l.data),tipoTag(l.tipo),esc(l.descricao),esc(l.torre||'Geral'),`<span class="${l.tipo==='Despesa'?'r':'g'}">${brl(l.valor)}</span>`]),'Nenhum lançamento cadastrado.')}
  </div>`;
},
financeiro(){
  const c=calc(),rows=db.lanc.slice().sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div class="page-head"><h2>Financeiro</h2><div class="chip">Saldo: <b>${brl(c.saldo)}</b> | Fundo: <b>${brl(c.fundo)}</b></div></div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-plus"></i>Novo Lançamento</h4></div>

    ${tbl(['Data','Tipo','Categoria','Descrição','Torre','Valor',''],rows.map(l=>[dt(l.data),tipoTag(l.tipo),esc(l.categoria),esc(l.descricao),esc(l.torre||'Geral'),
      `<span class="${/Despesa|Resgate/.test(l.tipo)?'r':'g'}">${brl(l.valor)}</span>`,delBtn('lanc',l.id)]),'Nenhum lançamento cadastrado.')}
  </div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-sliders"></i>Parâmetros do Teto de Gastos</h4></div>
    <form class="form" id="fCfg">
      <div><label>Salário Mínimo (R$)</label><input type="number" step="0.01" name="salario" value="${db.config.salario}" required></div>
      <div><label>Multiplicador do Teto</label><input type="number" step="0.5" min="1" name="mult" value="${db.config.mult}" required></div>
      <div><button class="btn sec"><i class="fa-solid fa-check"></i>Atualizar</button></div>
    </form></div>`;
},
manutencao(){
  const rows=db.manut.slice().sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div class="page-head"><h2>Manutenção &amp; Torres</h2></div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-plus"></i>Nova Manutenção / Ocorrência</h4></div>
    <form class="form" id="fMan">
      <div><label>Data</label><input type="date" name="data" value="${today()}" required></div>
      <div><label>Torre</label><select name="torre">${TORRES.map(t=>`<option>${t}</option>`).join('')}<option>Área Comum</option></select></div>
      <div><label>Tipo</label><select name="tipo"><option>Manutenção</option><option>Ocorrência</option><option>Preventiva</option></select></div>
      <div><label>Prioridade</label><select name="prioridade"><option>Baixa</option><option selected>Média</option><option>Alta</option><option>Urgente</option></select></div>
      <div style="grid-column:span 2"><label>Descrição</label><input name="titulo" required></div>
      <div><label>Responsável / Fornecedor</label><input name="resp"></div>

      <div><button class="btn"><i class="fa-solid fa-floppy-disk"></i>Registrar</button></div>
    </form></div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-screwdriver-wrench"></i>Registros</h4><small>${rows.length} registro(s)</small></div>
    ${tbl(['Data','Torre','Tipo','Descrição','Prioridade','Responsável','Custo','Status',''],rows.map(m=>[dt(m.data),
      `<span style="color:${TCOR[m.torre]||'#cbd5e1'}">${esc(m.torre)}</span>`,esc(m.tipo),esc(m.titulo),prioTag(m.prioridade),esc(m.resp||'-'),brl(m.custo),
      `<select onchange="setStatus('${m.id}',this.value)">${['Aberta','Em andamento','Concluída'].map(s=>`<option ${s===m.status?'selected':''}>${s}</option>`).join('')}</select>`,
      delBtn('manut',m.id)]),'Nenhuma manutenção registrada.')}
  </div>`;
},
fornecedores(){
  return `
  <div class="page-head"><h2>Fornecedores &amp; Contratos</h2></div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-plus"></i>Novo Fornecedor / Contrato</h4></div>
    <form class="form" id="fForn">
      <div style="grid-column:span 2"><label>Razão Social / Nome</label><input name="nome" required></div>
      <div><label>CNPJ / CPF</label><input name="doc"></div>
      <div><label>Serviço</label><input name="servico" required></div>
      <div><label>Contato</label><input name="contato"></div>
      <div><label>Início</label><input type="date" name="inicio"></div>
      <div><label>Término</label><input type="date" name="fim"></div>
      <div><label>Valor mensal (R$)</label><input type="number" step="0.01" min="0" name="valor"></div>
      <div><label>Status</label><select name="status"><option>Ativo</option><option>Suspenso</option><option>Encerrado</option></select></div>
      <div><button class="btn"><i class="fa-solid fa-floppy-disk"></i>Salvar</button></div>
    </form></div>
  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-handshake"></i>Contratos</h4><small>${db.forn.length} registro(s)</small></div>

      const venc=f.fim&&f.status==='Ativo'&&(new Date(f.fim)-new Date())/864e5<=30;

      `<select onchange="setForn('${f.id}',this.value)">${['Ativo','Suspenso','Encerrado'].map(s=>`<option ${s===f.status?'selected':''}>${s}</option>`).join('')}</select>`,delBtn('forn',f.id)]}),'Nenhum fornecedor cadastrado.')}
  </div>`;
},
usuarios(){
  const adm=isAdmin();
  return `
  <div class="page-head"><h2>Gestão de Usuários</h2></div>

  ${adm?`<div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-user-plus"></i>Novo Usuário</h4></div>
    <form class="form" id="fUser">

      <div><label>Perfil</label><select name="perfil"><option>Administrador</option><option selected>Síndico</option><option>Subsíndico</option><option>Conselho Fiscal</option><option>Operador</option></select></div>

      <div><button class="btn"><i class="fa-solid fa-floppy-disk"></i>Criar</button></div>

  <div class="panel"><div class="panel-h"><h4><i class="fa-solid fa-key"></i>Alterar Minha Senha</h4></div>

banco(){

/* ---------- Componentes ---------- */
function tbl(h,rows,empty){
  if(!rows.length)return `<div class="empty">${empty}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function tipoTag(t){const c={'Receita':'#34d399','Despesa':'#f87171','Fundo de Reserva':'#60a5fa','Resgate do Fundo':'#fbbf24'}[t];return `<span class="tag" style="background:${c}22;color:${c}">${t}</span>`}
function prioTag(p){const c={'Baixa':'#94a3b8','Média':'#60a5fa','Alta':'#fbbf24','Urgente':'#f87171'}[p];return `<span class="tag" style="background:${c}22;color:${c}">${p}</span>`}
function delBtn(col,id){return `<button class="icon-btn" title="Excluir" onclick="del('${col}','${id}')"><i class="fa-solid fa-trash"></i></button>`}

/* ---------- Ações ---------- */
function del(col,id){
  if(col==='users'&&!isAdmin())return;
  if(!confirm('Confirma a exclusão deste registro?'))return;
  const it=db[col].find(x=>x.id===id);db[col]=db[col].filter(x=>x.id!==id);
  log(`Exclusão em ${col}: ${it.descricao||it.titulo||it.nome||it.user||id}`);rerender();toast('Registro excluído.');
}
function setStatus(id,s){const m=db.manut.find(x=>x.id===id);m.status=s;log(`Manutenção "${m.titulo}" → ${s}`);rerender()}
function setForn(id,s){const f=db.forn.find(x=>x.id===id);f.status=s;log(`Contrato "${f.nome}" → ${s}`);rerender()}
function toggleUser(id){const u=db.users.find(x=>x.id===id);u.ativo=!u.ativo;log(`Usuário ${u.user} ${u.ativo?'ativado':'inativado'}`);rerender()}
function resetUser(id){
  const u=db.users.find(x=>x.id===id),bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<form class="modal form" style="display:block"><h4>Redefinir senha — ${esc(u.user)}</h4>
    <label>Nova senha (mín. 6 caracteres)</label><input type="password" name="nova" minlength="6" required>
    <div class="acts"><button type="button" class="btn sec" data-x>Cancelar</button><button class="btn">Salvar</button></div></form>`;
  document.body.appendChild(bg);addEyes(bg);bg.querySelector('input').focus();
  bg.querySelector('[data-x]').onclick=()=>bg.remove();
  bg.querySelector('form').onsubmit=e=>{e.preventDefault();u.hash=hashPass(u.user,e.target.nova.value);log(`Senha redefinida: ${u.user}`);bg.remove();toast('Senha redefinida.')};
}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download=`bluevillage-backup-${today()}.json`;a.click();log('Backup exportado')}
function importDB(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.users||!d.lanc)throw 0;if(!confirm('Substituir todos os dados atuais pelo backup?'))return;db=d;log('Backup importado');rerender();toast('Backup importado.')}catch(e){toast('Arquivo inválido.',1)}};r.readAsText(f)}
function resetDB(){if(!confirm('Isso apagará TODOS os dados (lançamentos, manutenções, contratos, usuários e logs) e recriará o usuário admin padrão. Continuar?'))return;
  db=seed();save();sessionStorage.removeItem('bv_sess');location.reload()}

const AFTER={
financeiro(){
  fLanc.onsubmit=e=>{e.preventDefault();const d=formData(e.target);d.id=uid();d.valor=+d.valor;db.lanc.push(d);log(`Lançamento ${d.tipo}: ${d.descricao} (${brl(d.valor)})`);rerender();toast('Lançamento salvo.')};
  fCfg.onsubmit=e=>{e.preventDefault();const d=formData(e.target);db.config={salario:+d.salario,mult:+d.mult};log('Parâmetros do teto atualizados');rerender();toast('Parâmetros atualizados.')};
},
manutencao(){fMan.onsubmit=e=>{e.preventDefault();const d=formData(e.target);d.id=uid();d.custo=+d.custo||0;d.status='Aberta';db.manut.push(d);log(`Manutenção registrada (${d.torre}): ${d.titulo}`);rerender();toast('Registro salvo.')}},
fornecedores(){fForn.onsubmit=e=>{e.preventDefault();const d=formData(e.target);d.id=uid();d.valor=+d.valor||0;db.forn.push(d);log(`Fornecedor cadastrado: ${d.nome}`);rerender();toast('Fornecedor salvo.')}},
usuarios(){
  if(window.fUser)fUser.onsubmit=e=>{e.preventDefault();const d=formData(e.target);const u=d.user.trim().toLowerCase();
    if(db.users.some(x=>x.user===u))return toast('Usuário já existe.',1);
    db.users.push({id:uid(),user:u,nome:d.nome,perfil:d.perfil,hash:hashPass(u,d.senha),ativo:true});log(`Usuário criado: ${u} (${d.perfil})`);rerender();toast('Usuário criado.')};
  fPass.onsubmit=e=>{e.preventDefault();const d=formData(e.target),u=me();
    if(u.hash!==hashPass(u.user,d.atual))return toast('Senha atual incorreta.',1);
    u.hash=hashPass(u.user,d.nova);log('Senha alterada');save();e.target.reset();toast('Senha alterada.')};
}};
const _go=go;go=function(p){_go(p);save()};
/* ---------- Olho: mostrar/ocultar senha ---------- */
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.4 10.4 0 0 1 12 19C5.5 19 2 12 2 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.6 9.6 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M2 2l20 20"/></svg>';
function addEyes(root){
  root.querySelectorAll('input[type=password]:not([data-eye])').forEach(inp=>{
    inp.dataset.eye='1';
    const w=document.createElement('span');w.className='pw-wrap';inp.before(w);w.appendChild(inp);
    const b=document.createElement('button');b.type='button';b.className='pw-eye';b.innerHTML=EYE_OFF;
    b.title='Mostrar senha';b.setAttribute('aria-label','Mostrar senha');
    b.onclick=()=>{const show=inp.type==='password';inp.type=show?'text':'password';b.innerHTML=show?EYE:EYE_OFF;
      b.title=show?'Ocultar senha':'Mostrar senha';b.setAttribute('aria-label',b.title);inp.focus()};
    w.appendChild(b);
  });
}
addEyes(document);
boot();
</script>
