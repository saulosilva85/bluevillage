*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
button,.nav,label.btn,select,a,input[type=date]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.6;cursor:default}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
:root{color-scheme:dark}
/* preenchimento automático do navegador (Chrome/Edge/Safari): mantém o campo azul-escuro em vez de branco */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{
  -webkit-text-fill-color:#fff!important;caret-color:#fff;
  -webkit-box-shadow:0 0 0 1000px #0f172a inset!important;box-shadow:0 0 0 1000px #0f172a inset!important;
  transition:background-color 99999s ease-out 0s}
input:autofill{-webkit-text-fill-color:#fff!important;box-shadow:0 0 0 1000px #0f172a inset!important}

.login-card{width:447px;max-width:92vw;background:rgba(30,41,59,.92);border:1px solid rgba(71,85,105,.6);
  border-radius:16px;padding:34px 32px 32px;box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.login-card h1{text-align:center;color:var(--blue-l);font-size:23px;font-weight:700}
.login-card .sub{text-align:center;color:#cbd5e1;font-size:14px;margin:4px 0 26px}
.login-card label{display:block;font-size:14px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
.login-card input{width:100%;height:46px;background:#0f172a;border:1px solid var(--border);border-radius:8px;
  color:#fff;padding:0 16px;font-size:16px;margin-bottom:18px;outline:none}
.login-card input:focus{border-color:var(--blue-l)}
.btn-login{width:100%;height:44px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;
  font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(37,99,235,.45)}
.btn-login:hover{background:#1d4ed8}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:16px}

/* ===== APP ===== */
header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{width:40px;height:40px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-size:18px}
.brand b{font-size:18px;display:block}
.brand small{font-size:12px;color:var(--blue-l)}
/* usuário e sair no rodapé do menu */
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 8px 4px}
.side-user{display:flex;align-items:center;gap:12px;padding:6px 8px 12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
.side-user b{display:block;font-size:14px;line-height:1.3;word-break:break-word}
.side-user small{color:var(--muted);font-size:12px}
.logout{width:100%;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:8px;border:0;background:none;
  color:#e2e8f0;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
.logout i{width:20px;text-align:center;color:#cbd5e1}
@media(hover:hover){.logout:hover{background:#3a1720;color:var(--red)}.logout:hover i{color:var(--red)}}
.logout:active{background:#3a1720;color:var(--red)}
.menu-toggle{display:none;width:36px;height:36px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;margin-right:6px}
.layout{display:flex;min-height:calc(100vh - 74px);min-height:calc(100dvh - 74px)}
aside{width:248px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:16px 8px;
  display:flex;flex-direction:column;position:sticky;top:74px;height:calc(100vh - 74px);height:calc(100dvh - 74px);overflow-y:auto;overscroll-behavior:contain}
.nav{display:flex;align-items:center;gap:14px;padding:11px 16px;margin-bottom:6px;border-radius:8px;cursor:pointer;
  color:#e2e8f0;font-size:16px;font-weight:500;line-height:1.5}
.nav i{width:20px;text-align:center;color:#cbd5e1;font-size:16px}
@media(hover:hover){.nav:hover{background:#273449}}
.nav:active{background:#273449}
.nav.active,.nav.active:hover,.nav.active:active{background:var(--blue);color:#fff}
.nav.active i{color:#fff}
main{flex:1;padding:32px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:20px;font-weight:700}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:12.5px;color:#cbd5e1}
.chip b{color:var(--blue-l)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:16px 18px;margin-bottom:22px;border:1px solid}
.alert i{font-size:20px;margin-top:2px}
.alert b{display:block;font-size:14px}.alert span{font-size:13px}
.alert.ok{background:#0f2e33;border-color:#11604f;color:var(--green)}
.alert.warn{background:#33290f;border-color:#7a5a12;color:var(--yellow)}
.alert.bad{background:#3a1720;border-color:#7f1d2d;color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:18px;margin-bottom:24px}
.kpi .mini{margin-top:8px;font-size:12px;color:var(--muted)}
.pk{color:#f472b6}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 20px}
.kpi p{color:var(--muted);font-size:14px;margin-bottom:10px}
.kpi h3{font-size:clamp(18px,1.45vw,24px);font-weight:700;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:24px;gap:10px;flex-wrap:wrap}
.panel-h h4{font-size:18px;display:flex;gap:10px;align-items:center}
.panel-h h4 i{color:var(--blue-l)}
.panel-h small{color:var(--muted);font-size:12.5px}
.towers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tower{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:22px 20px}
.tower .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-weight:700;font-size:15px}
.badge{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:600}
.track{height:23px;border-radius:6px;background:#1e293b;overflow:hidden}
.track div{height:100%;border-radius:6px;transition:width .4s}
.tower .det{margin-top:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

/* forms & tables */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.form input,.form select,.form textarea{width:100%;height:38px;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;color:#fff;padding:0 10px;outline:none}
.form input:focus,.form select:focus{border-color:var(--blue-l)}
.btn{height:38px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:600;padding:0 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:#1d4ed8}
.btn.sec{background:#334155}.btn.sec:hover{background:#475569}
.btn.danger{background:#b91c1c}.btn.danger:hover{background:#991b1b}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #263347}
@media(hover:hover){tr:hover td{background:#223047}}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13.5px}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;min-width:34px;min-height:34px;border-radius:6px}
@media(hover:hover){.icon-btn:hover{color:#fff;background:rgba(148,163,184,.12)}.icon-btn.del:hover{color:var(--red)}}
.icon-btn:active{background:rgba(148,163,184,.18)}
.acoes{display:inline-flex;gap:2px;white-space:nowrap}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.span2{grid-column:span 2}
.modal-msg{font-size:14px;color:#cbd5e1;line-height:1.5}
.backdrop{display:none;position:fixed;left:0;right:0;bottom:0;top:74px;background:rgba(2,6,23,.6);z-index:9}
.backdrop.show{display:block}
.tag.concl{display:inline-flex;align-items:center;gap:5px;background:#34d39922;color:#34d399;padding:5px 10px;font-size:12.5px}
.tag.concl svg{width:13px;height:13px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;font-weight:600;white-space:nowrap}
.g{color:var(--green)}.r{color:var(--red)}.b{color:var(--blue-l)}.p{color:var(--purple)}.y{color:var(--yellow)}
td select{background:var(--bg);color:#fff;border:1px solid var(--border);border-radius:6px;height:30px;padding:0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:calc(100vw - 40px);background:#1e293b;border:1px solid var(--border);border-left:4px solid var(--green);
  padding:12px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--red)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
/* ---- campo de data + calendário próprio ---- */
.dp-btn{width:100%;height:38px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:#fff;padding:0 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-size:14px;text-align:left}
.dp-btn:focus-visible,.dp-btn.open{border-color:var(--blue-l);outline:none}
.dp-btn .vazio{color:#64748b}
.dp-btn svg{width:18px;height:18px;color:var(--blue-l);flex-shrink:0}
#dp{position:fixed;z-index:70;width:320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);user-select:none}
#dp .dp-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}
#dp .dp-sel{position:relative;flex:1;min-width:0}#dp .dp-sel[data-sel=a]{flex:0 0 92px}
#dp .dp-selb{width:100%;height:34px;background:var(--bg);color:#fff;border:1px solid var(--border);border-radius:7px;padding:0 8px;font-weight:700;
  font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer}
#dp .dp-selb.open{border-color:var(--blue-l)}#dp .dp-selb svg{width:14px;height:14px;flex-shrink:0;transition:transform .15s}#dp .dp-selb.open svg{transform:rotate(180deg)}
#dp .dp-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:2;max-height:252px;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 12px 28px rgba(0,0,0,.5)}

<body>

<!-- ============ LOGIN ============ -->
<div id="login">

    <h1>Blue Village Residence</h1>
    <div class="sub">Gestão 2027</div>
    <label for="lUser">Usuário</label>
    <input id="lUser" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">

</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <button class="menu-toggle" type="button" aria-label="Abrir menu" onclick="toggleMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="ico"><i class="fa-solid fa-building-shield"></i></div>
      <div><b>Gestão Blue Village</b><small>Torres: Jurerê | Gunga | Itacaré</small></div>
    </div>
  </header>
  <div class="layout">
    <div class="backdrop" id="backdrop" onclick="toggleMenu(false)"></div>
    <aside id="aside">
      <div class="nav active" data-page="dashboard" role="button" tabindex="0"><i class="fa-solid fa-chart-pie"></i>Dashboard &amp; Torres</div>
      <div class="nav" data-page="financeiro" role="button" tabindex="0"><i class="fa-solid fa-wallet"></i>Financeiro</div>
      <div class="nav" data-page="manutencao" role="button" tabindex="0"><i class="fa-solid fa-screwdriver-wrench"></i>Manutenção &amp; Torres</div>
      <div class="nav" data-page="fornecedores" role="button" tabindex="0"><i class="fa-solid fa-handshake"></i>Fornecedores &amp; Contratos</div>
      <div class="nav" data-page="usuarios" role="button" tabindex="0"><i class="fa-solid fa-users"></i>Gestão de Usuários</div>
      <div class="nav" data-page="banco" role="button" tabindex="0"><i class="fa-solid fa-database"></i>Banco &amp; Logs</div>
      <div class="side-foot">
        <div class="side-user"><div class="avatar" id="userAvatar"></div><div><b id="userName"></b><small id="userRole"></small></div></div>
        <button class="logout" type="button" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Sair</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO SUPABASE  (banco de dados online compartilhado)
   Supabase > Project Settings > API: copie "Project URL" e a chave "anon public".
   Passo a passo no README.md.
   ===================================================================== */
const SUPABASE_URL = "https://nusiftldrfdpfnaghuih.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51c2lmdGxkcmZkcGZuYWdodWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NjM3MjksImV4cCI6MjExMDQzOTcyOX0.itapppygBh89WdypUKOmgPvPGTNluhwfj60e7WgCI5A";
const SB_VER='2.45.4';
const EMAIL_DOMAIN='bluevillage.app';   // domínio interno dos logins (nenhum e-mail é enviado)
const SENHA_PADRAO='Blue@2027!';        // senha do primeiro acesso do admin

/* ---------- Estado ---------- */
const TORRES=['Jurerê','Gunga','Itacaré'];
const TCOR={'Jurerê':'#60a5fa','Gunga':'#34d399','Itacaré':'#c084fc'};
const DEF_CFG={salario:1518,mult:5};
const LEGACY_KEY='bluevillage_db_v1',MIGRADO_KEY='bluevillage_migrado';
let db={users:[],lanc:[],manut:[],forn:[],logs:[],config:{...DEF_CFG}};
let SBM,sb,meProfile=null,canal=null,pollTimer=null,timers={};
let curPage='dashboard',pendingRender=false,justLoggedIn=false,sessionUid=null;
const me=()=>meProfile;
const isAdmin=()=>!!meProfile&&meProfile.perfil==='Administrador';

/* ---------- Utilidades ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR'):'-';
const dth=s=>new Date(s).toLocaleString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ym=()=>today().slice(0,7);
const numBR=v=>String(+v||0).replace('.',',');
/* aceita "1.234,56", "1234,56", "1234.56", "R$ 50" */
function parseValor(s){
  s=String(s??'').replace(/R\$|\s/g,'');if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isFinite(n)?Math.round(n*100)/100:NaN;
}
function toast(msg,err){document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4500:2600)}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function errMsg(e){
  const c=String((e&&(e.code||''))||''),m=String((e&&(e.message||e.error_description||e.msg))||e||'');
  if(/invalid login credentials|invalid_credentials|invalid-credential/i.test(m+c))return 'Usuário ou senha inválidos.';
  if(/email logins are disabled|email_provider_disabled|provider is not enabled/i.test(m+c))return 'Login por e-mail desativado no Supabase: ative o provedor "Email" em Authentication > Sign In / Providers (veja o README).';
  if(/email not confirmed/i.test(m))return 'Login não confirmado: execute novamente o supabase.sql no Supabase e desative "Confirm email" (veja o README).';
  if(/already registered|already exists|user_already_exists/i.test(m+c))return 'Este usuário já existe.';
  if(/signups not allowed|signup_disabled/i.test(m+c))return 'Cadastro de logins desativado no Supabase: ative "Allow new users to sign up" (veja o README).';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if(/failed to fetch|networkerror|network request failed|load failed|sem-conexao/i.test(m+c))return 'Sem conexão com a internet. Verifique e tente novamente.';
  if(/registro conclu/i.test(m))return 'Registro concluído: o status não pode mais ser alterado.';
  if(c==='42501'||/row-level security|não autorizado|permission/i.test(m))return 'Sem permissão para esta ação.';
  if(/password should be|weak/i.test(m))return 'Senha fraca: use no mínimo 6 caracteres.';
  if(/invalid api key|no api key/i.test(m))return 'Configuração do Supabase inválida (veja o README).';
  if(c==='42P01'||c==='PGRST202'||/does not exist|could not find the function/i.test(m))return 'Banco não preparado: execute o arquivo supabase.sql no Supabase (veja o README).';
  return 'Erro: '+(m||c);
}
async function q(p){const{data,error}=await p;if(error)throw error;return data}
/* executa uma gravação, atualiza as tabelas afetadas e avisa o resultado; trava o botão contra toque duplo */
async function run(p,okMsg,tabs=[],formId){if(formId)travar(formId);
  try{await p;if(okMsg)toast(okMsg);await refresh(tabs)}catch(e){console.error(e);toast(errMsg(e),1)}finally{if(formId)liberar(formId)}}
/* trava o formulário enquanto salva (evita toque duplo), mesmo que a tela seja redesenhada no meio */
const ocupado={};
function travar(id){ocupado[id]=true;marcarOcupados()}
function liberar(id){delete ocupado[id];marcarOcupados()}
function marcarOcupados(){document.querySelectorAll('form[id]').forEach(f=>{const b=f.querySelector('.btn:not([type=button])');if(b)b.disabled=!!ocupado[f.id]})}
/* limpa o formulário que está na tela agora (a tela pode ter sido redesenhada enquanto salvava) */
function limparForm(id){const f=document.getElementById(id);if(f)f.reset()}
const emailDe=u=>`${u}@${EMAIL_DOMAIN}`;
function log(acao){if(!sb||!meProfile)return;sb.from('logs').insert({usuario:meProfile.user,acao}).then(()=>agendar('logs'),()=>{})}
const COLS={lanc:['id','data','tipo','categoria','torre','descricao','valor'],manut:['id','data','torre','tipo','prioridade','titulo','resp','custo','status'],
  forn:['id','nome','doc','servico','contato','inicio','fim','valor','status']};
const DATAS=['data','inicio','fim'],NUMS=['valor','custo'];
function limpa(t,o){const r={};COLS[t].forEach(k=>{let v=o[k];if(DATAS.includes(k)&&!v)v=null;if(NUMS.includes(k))v=+v||0;if(v!==undefined)r[k]=v??null});if(!r.id)r.id=uid();return r}
async function upsertLotes(t,rows){for(let i=0;i<rows.length;i+=500)await q(sb.from(t).upsert(rows.slice(i,i+500)))}

/* ---------- Janela de confirmação (substitui confirm() do navegador) ---------- */
function confirmBox(msg,okTxt='Confirmar',danger=true){fecharCal();return new Promise(res=>{
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h4>Confirmação</h4><p class="modal-msg">${esc(msg)}</p>
    <div class="acts"><button type="button" class="btn sec" data-n>Cancelar</button><button type="button" class="btn ${danger?'danger':''}" data-s>${esc(okTxt)}</button></div></div>`;
  const fim=v=>{bg.remove();res(v);softRender()};
  bg.querySelector('[data-n]').onclick=()=>fim(false);bg.querySelector('[data-s]').onclick=()=>fim(true);
  bg.onclick=e=>{if(e.target===bg)fim(false)};document.body.appendChild(bg);
})}

/* ---------- Cálculos ---------- */
function calc(){
  const soma=a=>a.reduce((s,l)=>s+(+l.valor||0),0);
  const rec=soma(db.lanc.filter(l=>l.tipo==='Receita'));
  const sal=db.lanc.filter(l=>l.tipo==='Salão de Festa');
  const salCred=soma(sal.filter(l=>l.descricao==='Crédito')),salDeb=soma(sal.filter(l=>l.descricao==='Débito'));
  const desp=soma(db.lanc.filter(isDesp));
  const despMes=soma(db.lanc.filter(l=>isDesp(l)&&String(l.data).slice(0,7)===ym()));
  const fundo=soma(db.lanc.filter(l=>l.tipo==='Fundo de Reserva'))-soma(db.lanc.filter(l=>l.tipo==='Resgate do Fundo'));
  const contratos=db.forn.filter(c=>c.status==='Ativo').length;
  const teto=db.config.salario*db.config.mult;
  return{saldo:rec-desp,despMes,fundo,contratos,teto,salao:salCred-salDeb,salCred,salDeb};
}

/* ---------- Conexão com o Supabase ---------- */
async function loadSupabase(){
  SBM=await import(`https://cdn.jsdelivr.net/npm/@supabase/supabase-js@${SB_VER}/+esm`);
  sb=SBM.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
}
/* cria o login de outro usuário sem deslogar o administrador (usa um 2º cliente sem sessão) */
async function criarConta(user,senha){
  const sec=SBM.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'bv-sec-'+uid()}});
  const tentar=()=>sec.auth.signUp({email:emailDe(user),password:senha});
  try{
    let r=await tentar();
    if(r.error&&/already registered|already exists/i.test(r.error.message)){await q(sb.rpc('admin_remover_orfao',{email_alvo:emailDe(user)}));r=await tentar()}
    if(r.error)throw r.error;
    if(!r.data.session){const s2=await sec.auth.signInWithPassword({email:emailDe(user),password:senha});if(s2.error)throw s2.error}
    return r.data.user.id;
  }finally{await sec.auth.signOut().catch(()=>{})}
}

/* ---------- Login / sessão ---------- */
function setBusy(b,txt){btnLogin.disabled=b;btnLogin.textContent=b?txt:'Acessar Sistema'}
function showLogin(){fecharCal();pararTempoReal();meProfile=null;sessionUid=null;app.classList.add('hidden');login.classList.remove('hidden');toggleMenu(false);
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());main.innerHTML='';setBusy(false);
  if(location.hash)history.replaceState(null,'',location.pathname+location.search)}
loginForm.onsubmit=async e=>{
  e.preventDefault();if(!sb||btnLogin.disabled)return;
  const u=lUser.value.trim().toLowerCase(),p=lPass.value;loginErr.textContent='';
  if(!u||!p){loginErr.textContent='Informe usuário e senha.';return}
  if(!/^[a-z0-9._-]+$/.test(u)){loginErr.textContent='Usuário ou senha inválidos.';return}
  setBusy(true,'Entrando...');justLoggedIn=true;
  try{
    const{error}=await sb.auth.signInWithPassword({email:emailDe(u),password:p});
    if(error){
      /* primeiro acesso: cria o login do admin */
      if(u==='admin'&&p===SENHA_PADRAO&&/invalid/i.test(error.message)&&await q(sb.rpc('precisa_bootstrap'))){
        const r=await sb.auth.signUp({email:emailDe('admin'),password:p});
        if(r.error)throw r.error;
        if(!r.data.session){const s2=await sb.auth.signInWithPassword({email:emailDe('admin'),password:p});if(s2.error)throw s2.error}
      }else throw error;
    }
    lPass.value='';
  }catch(err){console.error(err);justLoggedIn=false;loginErr.textContent=errMsg(err);setBusy(false)}
};
async function startSession(user){
  if(sessionUid===user.id)return;sessionUid=user.id;
  setBusy(true,'Carregando...');
  try{
    let p=await q(sb.from('perfis').select('*').eq('id',user.id).maybeSingle());
    if(!p&&user.email===emailDe('admin')&&await q(sb.rpc('precisa_bootstrap'))){
      await q(sb.rpc('bootstrap_admin'));p=await q(sb.from('perfis').select('*').eq('id',user.id).maybeSingle());
    }
    if(!p||!p.ativo){const m=p?'Usuário inativo. Procure o administrador.':'Usuário sem acesso. Procure o administrador.';
      justLoggedIn=false;await sb.auth.signOut();loginErr.textContent=m;return}
    meProfile=perfilApp(p);
    await refresh(['lanc','manut','forn','users','logs','config']);
    iniciarTempoReal();
    login.classList.add('hidden');app.classList.remove('hidden');setSideUser();
    go('dashboard'); // sempre abre no Dashboard & Torres
    if(justLoggedIn){log('Login realizado');justLoggedIn=false}
  }catch(e){console.error(e);sessionUid=null;justLoggedIn=false;await sb.auth.signOut().catch(()=>{});loginErr.textContent=errMsg(e);setBusy(false)}
}
const perfilApp=p=>({id:p.id,user:p.usuario,nome:p.nome,perfil:p.perfil,ativo:p.ativo});
function setSideUser(){userName.textContent=meProfile.nome;userRole.textContent=meProfile.perfil;userAvatar.textContent=(meProfile.nome[0]||'?').toUpperCase()}
async function logout(){if(!(await confirmBox('Deseja sair do sistema?','Sair',false)))return;
  log('Logout');await new Promise(r=>setTimeout(r,200));await sb.auth.signOut()}

/* ---------- Dados (todos os aparelhos veem as mesmas informações) ---------- */
async function buscar(k){
  if(k==='lanc'||k==='manut'||k==='forn'){db[k]=(await q(sb.from(k).select('*'))).map(r=>{const o={...r};NUMS.forEach(n=>{if(n in o)o[n]=+o[n]||0});DATAS.forEach(d=>{if(o[d]==null&&d!=='data')o[d]=''});return o});return}
  if(k==='users'){db.users=(await q(sb.from('perfis').select('*'))).map(perfilApp);conferirAcesso();return}
  if(k==='logs'){db.logs=(await q(sb.from('logs').select('ts,usuario,acao').order('ts',{ascending:false}).limit(300))).map(l=>({ts:l.ts,user:l.usuario,acao:l.acao}));return}
  if(k==='config'){const r=await q(sb.from('config').select('*').eq('id','main').maybeSingle());db.config={...DEF_CFG,...(r?{salario:+r.salario,mult:+r.mult}:{})}}
}
async function refresh(ks){if(!ks||!ks.length)return;await Promise.all([...new Set(ks)].map(buscar));softRender()}
function conferirAcesso(){if(!sessionUid||app.classList.contains('hidden'))return;const eu=db.users.find(u=>u.id===sessionUid);
  if(!eu||!eu.ativo){toast('Seu acesso foi desativado.',1);sb.auth.signOut();return}meProfile=eu;setSideUser()}
/* agrupa várias mudanças seguidas numa única atualização */
function agendar(k){clearTimeout(timers[k]);timers[k]=setTimeout(()=>refresh([k]).catch(e=>console.warn(e)),150)}
const TAB_KEY={perfis:'users',lanc:'lanc',manut:'manut',forn:'forn',logs:'logs',config:'config'};
function iniciarTempoReal(){
  pararTempoReal();
  canal=sb.channel('bv-'+uid());
  Object.keys(TAB_KEY).forEach(t=>canal.on('postgres_changes',{event:'*',schema:'public',table:t},()=>agendar(TAB_KEY[t])));
  canal.subscribe();
  /* segurança extra: se o tempo real cair (rede do celular), atualiza a cada 30s e ao voltar para a aba */
  pollTimer=setInterval(()=>{if(!document.hidden)refresh(Object.values(TAB_KEY)).catch(()=>{})},30000);
}
function pararTempoReal(){if(canal&&sb){sb.removeChannel(canal).catch(()=>{})}canal=null;clearInterval(pollTimer);pollTimer=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sessionUid&&!app.classList.contains('hidden'))refresh(Object.values(TAB_KEY)).catch(()=>{})});

/* ---------- Navegação e renderização ---------- */
function toggleMenu(force){fecharCal();const open=force??!aside.classList.contains('open');aside.classList.toggle('open',open);backdrop.classList.toggle('show',open)}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{go(n.dataset.page);toggleMenu(false)});
function editando(){const a=document.activeElement;return !!document.querySelector('.modal-bg')||dpAlvo!==null||(!!a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))}
/* atualiza a tela quando chegam dados de outro aparelho, sem apagar o que está sendo digitado */
function softRender(){if(app.classList.contains('hidden'))return;if(editando()){pendingRender=true;return}pendingRender=false;render(curPage,true)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender)softRender()},60));
function saveForms(){return[...main.querySelectorAll('form[id]')].map(f=>[f.id,[...f.elements].filter(x=>x.name).map(x=>[x.name,x.value])])}
function restoreForms(s){s.forEach(([id,vals])=>{const f=document.getElementById(id);if(f)vals.forEach(([n,v])=>{const x=f.elements[n];if(x&&x.value!==v)x.value=v})})}
function render(p,keep){
  if(!PAGES[p])p='dashboard';
  const saved=keep&&p===curPage?saveForms():null,y=window.scrollY;
  curPage=p;history.replaceState(null,'','#'+p);
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));
  main.innerHTML=PAGES[p]();(AFTER[p]||(()=>{}))();addEyes(main);marcarOcupados();
  if(saved){restoreForms(saved);window.scrollTo(0,y)}else window.scrollTo(0,0);
  syncDatas(main);
}
const go=p=>{fecharCal();render(p,false)};

/* ---------- Campo de data com calendário próprio (dd/mm/aaaa) ---------- */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ICO_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
const ICO_ESQ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ICO_DIR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const isoBR=v=>v?v.split('-').reverse().join('/'):'';
const isoDe=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* gera: campo escondido com a data (AAAA-MM-DD, o que é salvo) + botão que mostra dd/mm/aaaa e abre o calendário */
function campoData(grupo,nome,valor,o={}){const id=`dp-${grupo}-${nome}`;
  return `<input type="hidden" id="${id}" ${o.semNome?'':`name="${nome}"`} value="${esc(valor||'')}" data-dp data-def="${esc(o.def??valor??'')}" ${o.obrig?'data-obrig':''} ${o.par?`data-par="${o.par}" data-lado="${o.lado}"`:''}>
    <button type="button" class="dp-btn" data-for="${id}" onclick="abrirCal('${id}',this)" aria-label="Escolher data"><span></span>${ICO_CAL}</button>`}
function syncDatas(root=document){root.querySelectorAll('.dp-btn').forEach(b=>{const h=document.getElementById(b.dataset.for);if(!h)return;
  const sp=b.querySelector('span');sp.textContent=h.value?isoBR(h.value):'dd/mm/aaaa';sp.className=h.value?'':'vazio'})}
/* reset de formulário: volta as datas para o padrão do campo */
document.addEventListener('reset',e=>{e.target.querySelectorAll('[data-dp]').forEach(h=>h.value=h.dataset.def||'');setTimeout(()=>syncDatas(e.target),0)},true);
let dpAlvo=null,dpMes=null,dpLista=null;
const ICO_BAIXO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
/* lista de mês/ano própria do sistema (igual no computador e no celular) */
function listaSel(k,rot,txt,ops,atual){const ab=dpLista===k;
  return `<div class="dp-sel" data-sel="${k}"><button type="button" class="dp-selb ${ab?'open':''}" aria-label="${rot}" aria-expanded="${ab}"><span>${txt}</span>${ICO_BAIXO}</button>
  ${ab?`<div class="dp-list" role="listbox">${ops.map(([v,n])=>`<button type="button" role="option" data-v="${v}" class="${v===atual?'sel':''}">${n}</button>`).join('')}</div>`:''}</div>`}
function abrirCal(id,btn){
  if(dpAlvo===id)return fecharCal();
  fecharCal();const h=document.getElementById(id);if(!h)return;
  dpAlvo=id;const base=h.value?new Date(h.value+'T12:00:00'):new Date();dpMes=new Date(base.getFullYear(),base.getMonth(),1);
  let el=document.getElementById('dp');if(!el){el=document.createElement('div');el.id='dp';el.setAttribute('role','dialog');document.body.appendChild(el);
    const bg=document.createElement('div');bg.id='dp-bg';bg.onclick=fecharCal;document.body.appendChild(bg)}
  btn.classList.add('open');desenharCal();posicionarCal(btn);document.getElementById('dp-bg').classList.add('show');
}
function posicionarCal(btn){const el=document.getElementById('dp');if(innerWidth<=800){el.style.left=el.style.top='';return}
  const r=btn.getBoundingClientRect(),w=el.offsetWidth,hh=el.offsetHeight;
  let left=Math.min(r.left,innerWidth-w-8),top=r.bottom+6;if(top+hh>innerHeight-8&&r.top-hh-6>8)top=r.top-hh-6;
  el.style.left=Math.max(8,left)+'px';el.style.top=Math.max(8,top)+'px'}
function fecharCal(){dpLista=null;const el=document.getElementById('dp');if(el)el.remove();const bg=document.getElementById('dp-bg');if(bg)bg.remove();
  document.querySelectorAll('.dp-btn.open').forEach(b=>b.classList.remove('open'));const tinha=dpAlvo!==null;dpAlvo=null;if(tinha&&pendingRender)setTimeout(softRender,30)}
function desenharCal(){
  const el=document.getElementById('dp'),h=document.getElementById(dpAlvo);if(!el||!h)return fecharCal();
  const sel=h.value,hoje=today(),y=dpMes.getFullYear(),m=dpMes.getMonth(),ini=new Date(y,m,1-new Date(y,m,1).getDay());
  /* para filtros De/Até: destaca a faixa entre as duas datas */
  let fx=null;if(h.dataset.par){const o=document.getElementById(h.dataset.par);const a=h.dataset.lado==='de'?h.value:o&&o.value,b=h.dataset.lado==='de'?o&&o.value:h.value;if(a&&b)fx=[a,b]}
  /* anos de 1950 até 50 anos à frente do ano atual (a lista acompanha a virada do ano automaticamente) */
  const anoAtual=new Date().getFullYear(),anos=[];for(let a=Math.min(1950,y);a<=Math.max(anoAtual+50,y);a++)anos.push(a);
  let dias='';for(let i=0;i<42;i++){const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i),iso=isoDe(d),dw=d.getDay();
    const cls=['dp-d',d.getMonth()!==m?'fora':'',dw===0||dw===6?'fds':'',iso===hoje?'hoje':'',iso===sel?'sel':'',fx&&iso>fx[0]&&iso<fx[1]?'faixa':''].filter(Boolean).join(' ');
    dias+=`<button type="button" class="${cls}" data-iso="${iso}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}">${d.getDate()}</button>`}
  el.innerHTML=`<div class="dp-h"><button type="button" class="dp-nav" data-nav="-1" aria-label="Mês anterior">${ICO_ESQ}</button>
    ${listaSel('m','Mês',MESES[m][0].toUpperCase()+MESES[m].slice(1),MESES.map((n,i)=>[i,n[0].toUpperCase()+n.slice(1)]),m)}
    ${listaSel('a','Ano',y,anos.map(a=>[a,a]),y)}
    <button type="button" class="dp-nav" data-nav="1" aria-label="Próximo mês">${ICO_DIR}</button></div>
    <div class="dp-g">${['D','S','T','Q','Q','S','S'].map(w=>`<div class="dp-w">${w}</div>`).join('')}${dias}</div>
    <div class="dp-f"><button type="button" data-limpar ${h.hasAttribute('data-obrig')?'style="visibility:hidden"':''}>Limpar</button><button type="button" data-hoje>Hoje</button></div>`;
  el.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{dpMes=new Date(y,m+ +b.dataset.nav,1);desenharCal()});
  el.querySelectorAll('.dp-selb').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.parentNode.dataset.sel;dpLista=dpLista===k?null:k;desenharCal()});
  el.querySelectorAll('.dp-list button').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.closest('.dp-sel').dataset.sel,v=+b.dataset.v;
    dpMes=k==='m'?new Date(y,v,1):new Date(v,m,1);dpLista=null;desenharCal()});
  el.onclick=e=>{if(dpLista&&!e.target.closest('.dp-sel')){dpLista=null;desenharCal()}};
  const ls=el.querySelector('.dp-list');if(ls){const sb=ls.querySelector('.sel');if(sb)ls.scrollTop=sb.offsetTop-ls.clientHeight/2+sb.offsetHeight/2}
  el.querySelectorAll('.dp-d').forEach(b=>b.onclick=()=>escolherData(b.dataset.iso));
  el.querySelector('[data-hoje]').onclick=()=>escolherData(hoje);
  el.querySelector('[data-limpar]').onclick=()=>escolherData('');
}
function escolherData(iso){const h=document.getElementById(dpAlvo);if(!h)return fecharCal();
  h.value=iso;const id=dpAlvo;fecharCal();syncDatas();h.dispatchEvent(new Event('change',{bubbles:true}));
  const b=document.querySelector(`.dp-btn[data-for="${id}"]`);if(b&&innerWidth>800)b.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dpAlvo){if(dpLista){dpLista=null;desenharCal()}else fecharCal()}});
/* clique/toque fora do calendário fecha (inclusive no menu lateral e em outras telas) */
document.addEventListener('pointerdown',e=>{if(dpAlvo&&!e.target.closest('#dp')&&!e.target.closest('.dp-btn'))fecharCal()},true);
window.addEventListener('resize',()=>{if(dpAlvo){const b=document.querySelector(`.dp-btn[data-for="${dpAlvo}"]`);if(b)posicionarCal(b)}});
window.addEventListener('scroll',()=>{if(dpAlvo&&innerWidth>800)fecharCal()},{passive:true});

/* ---------- Filtros por período ---------- */
const FLT={lanc:{de:'',ate:'',tipo:'',torre:'',at:'tudo'},manut:{de:'',ate:'',torre:'',status:'',at:'tudo'}};
const noPeriodo=(d,F)=>(!F.de||String(d)>=F.de)&&(!F.ate||String(d)<=F.ate);
function periodo(at){const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  if(at==='hoje')return[today(),today()];
  if(at==='semana'){const i=new Date(y,m,d.getDate()-6);return[isoDe(i),today()]}
  if(at==='mes')return[isoDe(new Date(y,m,1)),isoDe(new Date(y,m+1,0))];
  if(at==='mespassado')return[isoDe(new Date(y,m-1,1)),isoDe(new Date(y,m,0))];
  if(at==='ano')return[`${y}-01-01`,`${y}-12-31`];
  return['',''];}
function setFlt(t,k,v){const F=FLT[t];F[k]=v;
  if(k==='de'||k==='ate'){F.at='';if(F.de&&F.ate&&F.de>F.ate)[F.de,F.ate]=[F.ate,F.de]}
  render(curPage,true)}
function atalho(t,at){const F=FLT[t];[F.de,F.ate]=periodo(at);F.at=at;render(curPage,true)}
function limparFlt(t){const F=FLT[t];Object.keys(F).forEach(k=>F[k]='');F.at='tudo';render(curPage,true)}
function barraFiltro(t,extras){const F=FLT[t],ativo=F.de||F.ate||Object.entries(F).some(([k,v])=>!['de','ate','at'].includes(k)&&v);
  const ats=[['hoje','Hoje'],['semana','Últimos 7 dias'],['mes','Este mês'],['mespassado','Mês passado'],['ano','Este ano'],['tudo','Tudo']];
  return `<div class="filtros">
    <div><label>De</label>${campoData('flt'+t,'de',F.de,{semNome:1,def:'',par:`dp-flt${t}-ate`,lado:'de'})}</div>
    <div><label>Até</label>${campoData('flt'+t,'ate',F.ate,{semNome:1,def:'',par:`dp-flt${t}-de`,lado:'ate'})}</div>${extras}</div>
  <div class="atalhos">${ats.map(([k,n])=>`<button type="button" class="atalho ${F.at===k?'on':''}" onclick="atalho('${t}','${k}')">${n}</button>`).join('')}
    ${ativo?`<button type="button" class="atalho limpar" onclick="limparFlt('${t}')">Limpar filtros</button>`:''}</div>`}
/* mudança nos campos De/Até dos filtros */
document.addEventListener('change',e=>{const m=/^dp-flt(\w+)-(de|ate)$/.exec(e.target.id||'');if(m&&FLT[m[1]])setFlt(m[1],m[2],e.target.value)});

/* ---------- Dados da versão anterior (salvos só neste navegador) ---------- */
function legado(){if(localStorage.getItem(MIGRADO_KEY))return null;
  try{const d=JSON.parse(localStorage.getItem(LEGACY_KEY));if(d&&((d.lanc||[]).length||(d.manut||[]).length||(d.forn||[]).length))return d}catch(e){}return null}

},

/* ---------- Componentes ---------- */
function tbl(h,rows,empty){
  if(!rows.length)return `<div class="empty">${empty}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
/* Salão de Festa é uma conta separada: Crédito entra e Débito sai do saldo do salão (não mexe no Saldo em Conta nem no teto) */
const isDesp=l=>l.tipo==='Despesa';
const isSaida=l=>isDesp(l)||l.tipo==='Resgate do Fundo'||(l.tipo==='Salão de Festa'&&l.descricao==='Débito');
function tipoTag(t){const c={'Receita':'#34d399','Despesa':'#f87171','Fundo de Reserva':'#60a5fa','Resgate do Fundo':'#fbbf24','Salão de Festa':'#f472b6'}[t]||'#94a3b8';return `<span class="tag" style="background:${c}22;color:${c}">${esc(t)}</span>`}
function prioTag(p){const c={'Baixa':'#94a3b8','Média':'#60a5fa','Alta':'#fbbf24','Urgente':'#f87171'}[p]||'#94a3b8';return `<span class="tag" style="background:${c}22;color:${c}">${esc(p)}</span>`}
function delBtn(c,id){return `<button class="icon-btn del" title="Excluir" aria-label="Excluir" onclick="del('${c}','${id}')"><i class="fa-solid fa-trash"></i></button>`}

/* ---------- Ações ---------- */
async function del(c,id){
  if(c==='users'&&!isAdmin())return;
  const it=db[c].find(x=>x.id===id);if(!it)return;
  const nome=c==='users'?it.user:(it.titulo||it.nome||`${it.tipo} ${brl(it.valor)}`);
  if(!(await confirmBox(`Confirma a exclusão de "${nome}"?`,'Excluir')))return;
  if(c==='users')return run(q(sb.rpc('admin_excluir_usuario',{alvo:id})).then(()=>log(`Usuário excluído: ${it.user}`)),'Usuário excluído.',['users']);
  run(q(sb.from(c).delete().eq('id',id)).then(()=>log(`Exclusão em ${c}: ${nome}`)),'Registro excluído.',[c]);
}
async function setStatus(id,s){const m=db.manut.find(x=>x.id===id);if(!m)return;
  if(m.status==='Concluída'){toast('Registro concluído: o status não pode mais ser alterado.',1);return softRender()}
  if(s==='Concluída'&&!(await confirmBox(`Concluir "${m.titulo}"? Depois de concluído, o status não poderá mais ser alterado.`,'Concluir',false)))return render(curPage,true);
  run(q(sb.from('manut').update({status:s}).eq('id',id)).then(()=>log(`Manutenção "${m.titulo}" → ${s}`)),'Status atualizado.',['manut'])}
function setForn(id,s){const f=db.forn.find(x=>x.id===id);if(!f)return;run(q(sb.from('forn').update({status:s}).eq('id',id)).then(()=>log(`Contrato "${f.nome}" → ${s}`)),'Status atualizado.',['forn'])}
function toggleUser(id){const u=db.users.find(x=>x.id===id);if(!u)return;
  run(q(sb.from('perfis').update({ativo:!u.ativo}).eq('id',id)).then(()=>log(`Usuário ${u.user} ${u.ativo?'inativado':'ativado'}`)),u.ativo?'Usuário inativado.':'Usuário ativado.',['users'])}
function resetUser(id){fecharCal();
  const u=db.users.find(x=>x.id===id);if(!u)return;const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<form class="modal form" style="display:block" autocomplete="off"><h4>Redefinir senha — ${esc(u.user)}</h4>
    <label>Nova senha (mín. 6 caracteres)</label><input type="password" name="nova" minlength="6" required data-nova>
    <div class="acts"><button type="button" class="btn sec" data-x>Cancelar</button><button class="btn">Salvar</button></div></form>`;
  document.body.appendChild(bg);addEyes(bg);
  const fechar=()=>{bg.remove();softRender()};
  bg.querySelector('[data-x]').onclick=fechar;
  bg.querySelector('form').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button:not([type=button])');btn.disabled=true;btn.textContent='Salvando...';
    try{await q(sb.rpc('admin_definir_senha',{alvo:u.id,nova:e.target.nova.value}));log(`Senha redefinida: ${u.user}`);fechar();toast('Senha redefinida.')}
    catch(err){console.error(err);toast(errMsg(err),1);btn.disabled=false;btn.textContent='Salvar'}};
}
function exportDB(){
  const dados={versao:2,exportadoEm:new Date().toISOString(),lanc:db.lanc,manut:db.manut,forn:db.forn,config:db.config,
    users:db.users.map(u=>({nome:u.nome,user:u.user,perfil:u.perfil,ativo:u.ativo}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}));
  a.download=`bluevillage-backup-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);log('Backup exportado');toast('Backup gerado.')}
async function enviarDados(d){
  let n=0;for(const t of ['lanc','manut','forn']){const rows=(d[t]||[]).map(x=>limpa(t,x));await upsertLotes(t,rows);n+=rows.length}
  if(d.config&&+d.config.salario)await q(sb.from('config').upsert({id:'main',salario:+d.config.salario,mult:+d.config.mult||DEF_CFG.mult}));
  await refresh(['lanc','manut','forn','config']);return n;
}
function importDB(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();
  r.onload=async()=>{let d;try{d=JSON.parse(r.result);if(!Array.isArray(d.lanc))throw 0}catch(e){return toast('Arquivo de backup inválido.',1)}
    if(!(await confirmBox('Importar o backup? Registros com o mesmo código serão substituídos (usuários não são importados).','Importar',false)))return;
    try{const n=await enviarDados(d);log('Backup importado');toast(`Backup importado (${n} registros).`)}catch(e){console.error(e);toast(errMsg(e),1)}};
  r.readAsText(f)}
async function migrarLegado(){const d=legado();if(!d)return;
  if(!(await confirmBox('Enviar os dados deste navegador para a nuvem?','Enviar',false)))return;
  try{const n=await enviarDados(d);localStorage.setItem(MIGRADO_KEY,new Date().toISOString());log('Dados da versão anterior enviados para a nuvem');
    const us=(d.users||[]).filter(u=>u.user!=='admin').map(u=>u.user);
    toast(`${n} registros enviados.`+(us.length?` Recrie os usuários: ${us.join(', ')}.`:''));softRender()}
  catch(e){console.error(e);toast(errMsg(e),1)}}
async function descartarLegado(){if(!(await confirmBox('Descartar os dados antigos deste navegador? Eles não serão enviados para a nuvem.','Descartar')))return;
  localStorage.setItem(MIGRADO_KEY,'descartado');softRender()}
async function resetDB(){
  if(!(await confirmBox('Isso apagará TODOS os lançamentos, manutenções, contratos e logs da nuvem, em todos os aparelhos. Os usuários são mantidos. Continuar?','Zerar banco')))return;
  if(!(await confirmBox('Tem certeza? Esta ação não pode ser desfeita.','Sim, zerar tudo')))return;
  try{for(const t of ['lanc','manut','forn'])await q(sb.from(t).delete().neq('id',''));await q(sb.from('logs').delete().gt('id',0));
    log('Banco zerado');toast('Banco zerado.');await refresh(['lanc','manut','forn','logs'])}catch(e){console.error(e);toast(errMsg(e),1)}}

    travar('fPass');
    try{const{data:{user}}=await sb.auth.getUser();
      const r=await sb.auth.signInWithPassword({email:user.email,password:d.atual});if(r.error)throw{message:'atual-incorreta'};
      await q(sb.auth.updateUser({password:d.nova}));limparForm('fPass');log('Senha alterada');toast('Senha alterada.')}
    catch(err){console.error(err);toast(err.message==='atual-incorreta'?'Senha atual incorreta.':errMsg(err),1)}finally{liberar('fPass')}};
}};

/* ---------- Olho: mostrar/ocultar senha ---------- */
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.4 10.4 0 0 1 12 19C5.5 19 2 12 2 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.6 9.6 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M2 2l20 20"/></svg>';
/* Campos de senha NOVA viram texto mascarado: assim o navegador não oferece "senha forte"
   nem pede para salvar a senha de outra pessoa. Navegadores sem suporte ao mascaramento mantêm type=password. */
const MASCARA=typeof CSS!=='undefined'&&CSS.supports&&CSS.supports('-webkit-text-security','disc');
function addEyes(root){
  root.querySelectorAll('input[type=password]:not([data-eye])').forEach(inp=>{
    inp.dataset.eye='1';
    const nova=inp.hasAttribute('data-nova');
    if(nova){inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','none');inp.setAttribute('autocorrect','off');inp.spellcheck=false;
      inp.setAttribute('data-lpignore','true');inp.setAttribute('data-1p-ignore','');inp.setAttribute('data-bwignore','');
      if(MASCARA){inp.type='text';inp.classList.add('mask')}}
    const oculto=()=>nova&&MASCARA?inp.classList.contains('mask'):inp.type==='password';
    const w=document.createElement('span');w.className='pw-wrap';inp.before(w);w.appendChild(inp);
    const b=document.createElement('button');b.type='button';b.className='pw-eye';b.innerHTML=EYE_OFF;
    b.title='Mostrar senha';b.setAttribute('aria-label','Mostrar senha');
    b.addEventListener('pointerdown',e=>e.preventDefault()); // não tira o foco nem abre/fecha o teclado no celular
    b.onclick=()=>{const show=oculto();if(nova&&MASCARA)inp.classList.toggle('mask',!show);else inp.type=show?'text':'password';b.innerHTML=show?EYE:EYE_OFF;
      b.title=show?'Ocultar senha':'Mostrar senha';b.setAttribute('aria-label',b.title)};
    w.appendChild(b);
  });
}

/* ---------- Início ---------- */
(async()=>{
  addEyes(document);setBusy(true,'Conectando...');
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY){loginErr.textContent='Sistema ainda não configurado: falta a configuração do Supabase (veja o README).';setBusy(true,'Indisponível');return}
  try{await loadSupabase()}catch(e){console.error(e);loginErr.textContent='Não foi possível conectar ao servidor. Verifique a internet e recarregue a página.';setBusy(true,'Sem conexão');return}
  /* o Supabase recomenda não chamar o banco direto dentro deste evento: por isso o setTimeout */
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{if(session&&session.user)startSession(session.user);else showLogin()},0)});
})();
</script>
