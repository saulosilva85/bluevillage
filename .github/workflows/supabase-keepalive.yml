name: Manter Supabase ativo

# O plano gratuito do Supabase pausa projetos sem uso por 7 dias.
# Esta tarefa faz uma consulta leve a cada 3 dias para manter o banco ativo.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o Supabase
        run: |
          URL=$(grep -oP 'const SUPABASE_URL\s*=\s*"\K[^"]+' index.html || true)
          KEY=$(grep -oP 'const SUPABASE_ANON_KEY\s*=\s*"\K[^"]+' index.html || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase ainda não configurado no index.html"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/precisa_bootstrap" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase ativo."
